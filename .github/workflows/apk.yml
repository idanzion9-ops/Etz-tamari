name: בניית APK

# ידני בלבד — הכפתור "Run workflow".
# שימו לב: בניית APK לא נדרשת כדי לעדכן את האפליקציה אצל המשתמשים.
# האפליקציה טוענת את האתר מהרשת ומתעדכנת לבד בכל פרסום.
# בונים APK חדש רק לשינוי שם, אייקון, כתובת או גרסה.
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'שם הגרסה שיוצג למשתמש (למשל 1.0.1)'
        required: true
        default: '1.0.0'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: משיכת הקוד
        uses: actions/checkout@v4

      - name: התקנת JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: התקנת Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ה-SDK כבר מותקן על הרנר של GitHub.
      # android-actions/setup-android פוסל אותו ומנסה להחליפו — ונכשל.
      # לכן משתמשים במותקן ישירות.
      - name: איתור ה-Android SDK שעל הרנר
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::לא נמצא Android SDK על הרנר"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "נמצא SDK: $SDK"
          ls "$SDK"
          echo "--- cmdline-tools ---"
          ls "$SDK/cmdline-tools" || echo "אין cmdline-tools"

      - name: התאמת מבנה ה-SDK ל-Bubblewrap
        run: |
          # Bubblewrap מאשר נתיב SDK רק אם יש בתוכו תיקיית tools או bin ישירות.
          # ברנר הכלים יושבים ב-cmdline-tools/latest/bin, ולכן הוא פוסל אותו.
          # קישורים סמליים פותרים את זה בלי להזיז קבצים.
          SDK="$ANDROID_SDK_ROOT"

          # 1. לוודא ש-cmdline-tools/latest קיים
          if [ ! -d "$SDK/cmdline-tools/latest" ]; then
            FIRST=$(ls -d "$SDK"/cmdline-tools/*/ 2>/dev/null | head -1)
            if [ -n "$FIRST" ]; then
              sudo ln -sfn "${FIRST%/}" "$SDK/cmdline-tools/latest"
              echo "נוצר קישור cmdline-tools/latest אל $FIRST"
            else
              echo "::error::לא נמצאו cmdline-tools ב-$SDK"
              exit 1
            fi
          fi

          # 2. שתי התיקיות ש-Bubblewrap מחפש
          sudo ln -sfn "$SDK/cmdline-tools/latest"     "$SDK/tools"
          sudo ln -sfn "$SDK/cmdline-tools/latest/bin" "$SDK/bin"

          echo "--- מבנה ה-SDK ---"
          ls -la "$SDK" | grep -E 'tools|bin|platforms|build-tools' || true

          # 3. רישיונות וחבילות נדרשות לחתימה
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "build-tools;34.0.0" "platforms;android-34" > /dev/null 2>&1 || true
          echo "--- build-tools ---"
          ls "$SDK/build-tools" 2>/dev/null || echo "אין build-tools"

      - name: התקנת Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: הצבעה על JDK ועל ה-SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<JSON
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          JSON
          cat "$HOME/.bubblewrap/config.json"

      - name: שחזור מפתח החתימה
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::חסר הסוד ANDROID_KEYSTORE_BASE64. ראו את פרק האריזה ב-README."
            exit 1
          fi

          # הסוד עלול להגיע עם שורות חדשות או רווחים מהדבקה — מנקים לפני הפענוח
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' > ks.b64
          echo "אורך הסוד אחרי ניקוי: $(wc -c < ks.b64) תווים"

          if ! base64 -d ks.b64 > android.keystore 2>/dev/null; then
            echo "::error::הסוד ANDROID_KEYSTORE_BASE64 אינו base64 תקין — ככל הנראה הודבק חלקית."
            echo "::error::הדרך הבטוחה: gh secret set ANDROID_KEYSTORE_BASE64 -R ${{ github.repository }} < keystore.txt"
            exit 1
          fi
          rm -f ks.b64

          SIZE=$(wc -c < android.keystore)
          echo "גודל המפתח: $SIZE בתים"
          if [ "$SIZE" -lt 500 ]; then
            echo "::error::המפתח ששוחזר קטן מדי — הסוד כנראה חסר."
            exit 1
          fi

          # בדיקה אמיתית: האם זה מפתח שאפשר לפתוח עם הסיסמה שנשמרה
          if ! keytool -list -keystore android.keystore -alias etztamari \
                 -storepass "$STOREPASS" > /dev/null 2>&1; then
            echo "::error::לא ניתן לפתוח את המפתח. בדקו שהסיסמה בסוד ANDROID_KEYSTORE_PASSWORD נכונה,"
            echo "::error::ושהכינוי (alias) הוא etztamari."
            exit 1
          fi
          echo "מפתח החתימה שוחזר ואומת"

      - name: קביעת מספר הגרסה
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          # appVersionCode חייב לעלות בכל בנייה, אחרת אנדרואיד לא יתקין עדכון.
          # run_number של Actions עולה לבד בכל הרצה.
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            m.appVersionName = process.env.VERSION_NAME;
            m.appVersionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2));
            console.log("גרסה", m.appVersionName, "קוד", m.appVersionCode);
          '

      - name: יצירת פרויקט האנדרואיד
        run: |
          # update מייצר את הפרויקט מתוך twa-manifest.json.
          # הדגל משתנה בין גרסאות, לכן נסיון כפול.
          bubblewrap update --skipVersionUpgrade || bubblewrap update
          echo "--- קבצים שנוצרו ---"
          ls -la

      - name: בנייה וחתימה
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: הפקת assetlinks.json
        env:
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          FP=$(keytool -list -v -keystore android.keystore -alias etztamari \
                 -storepass "$STOREPASS" \
               | grep -i 'SHA256:' | head -1 | awk '{print $2}')
          echo "טביעת אצבע: $FP"
          cat > assetlinks.json <<JSON
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.etztamari.app",
              "sha256_cert_fingerprints": ["$FP"]
            }
          }]
          JSON
          cat assetlinks.json

      - name: איסוף התוצרים
        run: |
          mkdir -p out
          find . -name '*.apk' -not -path './out/*' -exec cp {} out/ \;
          find . -name '*.aab' -not -path './out/*' -exec cp {} out/ \;
          cp assetlinks.json out/
          echo "--- מה נארז ---"
          ls -la out
          if ! ls out/*.apk >/dev/null 2>&1; then
            echo "::error::לא נוצר קובץ APK"
            exit 1
          fi

      - name: העלאת החבילה
        uses: actions/upload-artifact@v4
        with:
          name: etz-tamari-apk-${{ github.run_number }}
          path: out/
          retention-days: 90

      # רץ גם כשהבנייה נכשלת — כדי שנוכל לראות מה קרה
      - name: לוג אבחון
        if: failure()
        run: |
          echo "=== תיקיית העבודה ==="
          ls -la
          echo "=== מבנה ה-SDK ==="
          ls -la "$ANDROID_SDK_ROOT" 2>/dev/null || echo "אין SDK"
          echo "=== cmdline-tools ==="
          ls -la "$ANDROID_SDK_ROOT/cmdline-tools" 2>/dev/null || true
          echo "=== config של Bubblewrap ==="
          cat "$HOME/.bubblewrap/config.json" 2>/dev/null || true
          echo "=== gradle ==="
          head -40 build.gradle 2>/dev/null || echo "אין build.gradle"
