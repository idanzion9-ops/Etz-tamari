name: בניית APK

# ידני בלבד — הכפתור "Run workflow".
# שימו לב: בניית APK לא נדרשת כדי לעדכן את האפליקציה אצל המשתמשים.
# האפליקציה טוענת את האתר מהרשת ומתעדכנת לבד בכל פרסום.
# בונים APK חדש רק לשינוי שם, אייקון, כתובת או גרסה.
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'שם הגרסה שיוצג למשתמש (למשל 1.0.1)'
        required: true
        default: '1.0.0'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: משיכת הקוד
        uses: actions/checkout@v4

      - name: התקנת JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: התקנת Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: התקנת Android SDK
        uses: android-actions/setup-android@v3

      - name: התקנת Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: הצבעה על JDK ועל ה-SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<JSON
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          JSON
          echo "JDK:  $JAVA_HOME"
          echo "SDK:  $ANDROID_SDK_ROOT"

      - name: שחזור מפתח החתימה
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::חסר הסוד ANDROID_KEYSTORE_BASE64. ראו את פרק האריזה ב-README."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android.keystore
          echo "מפתח החתימה שוחזר"

      - name: קביעת מספר הגרסה
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          # appVersionCode חייב לעלות בכל בנייה, אחרת אנדרואיד לא יתקין עדכון.
          # run_number של Actions עולה לבד בכל הרצה.
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            m.appVersionName = process.env.VERSION_NAME;
            m.appVersionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2));
            console.log("גרסה", m.appVersionName, "קוד", m.appVersionCode);
          '

      - name: בניית פרויקט האנדרואיד
        run: bubblewrap update --skipVersionUpgrade

      - name: בנייה וחתימה
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: הפקת assetlinks.json
        env:
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          FP=$(keytool -list -v -keystore android.keystore -alias etztamari \
                 -storepass "$STOREPASS" \
               | grep -i 'SHA256:' | head -1 | awk '{print $2}')
          echo "טביעת אצבע: $FP"
          cat > assetlinks.json <<JSON
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.etztamari.app",
              "sha256_cert_fingerprints": ["$FP"]
            }
          }]
          JSON
          cat assetlinks.json

      - name: איסוף התוצרים
        run: |
          mkdir -p out
          cp app-release-signed.apk out/etz-tamari.apk 2>/dev/null || true
          cp app-release-bundle.aab out/etz-tamari.aab 2>/dev/null || true
          cp assetlinks.json out/
          ls -la out

      - name: העלאת החבילה
        uses: actions/upload-artifact@v4
        with:
          name: etz-tamari-apk-${{ github.run_number }}
          path: out/
          retention-days: 90
